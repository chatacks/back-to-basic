<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Profile HTML</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav class="nav-header">
        <div class="logo">
          <i class="ph-duotone ph-globe-hemisphere-west"></i>
          <h4>Travelgram</h4>
        </div>

        <div class="nav-items">
          <ul>
            <li>
              <i class="ph ph-magnifying-glass"></i>
            </li>
            <li>Explorar</li>
            <li>Minhas viagens</li>
            <li>
              <img src="./images/Profile pic.png" alt="Foto de Perfil" />
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="profile">
        <div class="profile-content">
          <img src="./images/Profile pic.png" alt="Foto de Perfil" />
          <div>
            <h1></h1>
          </div>
        </div>
        <aside class="stats"></aside>
      </section>

      <section class="gallery"></section>
    </main>

    <footer></footer>
  </body>
</html>
